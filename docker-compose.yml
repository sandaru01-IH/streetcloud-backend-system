services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: streetcloud
      POSTGRES_PASSWORD: streetcloud
      POSTGRES_DB: streetcloud
    ports:
      - "5432:5432"
    volumes:
      - streetcloud-pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: streetcloud
      MINIO_ROOT_PASSWORD: streetcloud-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - streetcloud-minio:/data

volumes:
  streetcloud-pg:
  streetcloud-minio:
